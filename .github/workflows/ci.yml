name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No lockfile existed on this branch and registry access was unavailable
      # while preparing it. npm install validates the manifest and creates one;
      # switch this to npm ci when that generated lockfile is committed.
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
